<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bushy Writer v0.2</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        },
                        tealAccent: {
                            400: '#22d3ee',
                            500: '#06b6d4',
                            600: '#0891b2',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- CryptoJS for AES Encryption -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Content editable custom styling */
        [contenteditable]:empty:before {
            content: attr(placeholder);
            color: #9ca3af;
            cursor: text;
        }
        .dark [contenteditable]:empty:before {
            color: #6b7280;
        }
        
        /* Image wrapper and interactive overlays */
        .editor-image-wrapper {
            position: relative;
            display: inline-block;
            margin: 1rem 0;
            max-width: 100%;
            user-select: none;
            transition: all 0.2s ease;
        }
        .editor-image-wrapper img {
            border-radius: 0.75rem;
            max-width: 100%;
            height: auto;
            display: block;
            box-shadow: 0 4px 15px -3px rgba(0,0,0,0.1), 0 2px 6px -2px rgba(0,0,0,0.05);
            transition: ring 0.2s ease;
        }
        .editor-image-wrapper:hover img, .editor-image-wrapper.selected img {
            outline: 2px solid #6366f1;
            outline-offset: 2px;
        }
        
        /* Floating toolbar over image */
        .image-toolbar {
            position: absolute;
            top: -2.75rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 0.25rem;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            padding: 0.35rem 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 30;
        }
        .editor-image-wrapper:hover .image-toolbar,
        .editor-image-wrapper.selected .image-toolbar {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }
        
        /* Image alignment helpers */
        .editor-image-wrapper.align-center {
            display: flex;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
        }
        .editor-image-wrapper.align-left {
            float: left;
            margin-right: 1.5rem;
            margin-bottom: 1rem;
        }
        .editor-image-wrapper.align-right {
            float: right;
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col antialiased transition-colors duration-200">

    <!-- Top Header Navigation -->
    <header class="h-16 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-20 flex items-center justify-between px-4 lg:px-6">
        <!-- Left Title / Logo -->
        <div class="flex items-center space-x-3">
            <button id="toggleSidebarBtn" class="p-2 text-slate-500 hover:text-brand-600 dark:hover:text-brand-500 rounded-lg lg:hidden hover:bg-slate-100 dark:hover:bg-slate-800">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-tealAccent-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                    <i class="fa-solid fa-feather-pointed text-lg"></i>
                </div>
                <div>
                    <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-brand-600 via-indigo-500 to-tealAccent-500 bg-clip-text text-transparent">Bushy Writer</span>
                    <span class="text-xs px-1.5 py-0.5 rounded-full font-medium bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 border border-brand-200 dark:border-brand-800/60 ml-1">v0.2</span>
                </div>
            </div>
        </div>

        <!-- Editable Document Title Input -->
        <div class="flex-1 max-w-md mx-4">
            <input type="text" id="documentTitleInput" value="Untitled Story" class="w-full text-center sm:text-left text-sm font-semibold bg-transparent border border-transparent hover:border-slate-200 dark:hover:border-slate-700 focus:border-brand-500 dark:focus:border-brand-500 rounded-lg px-2.5 py-1 focus:outline-none transition-all text-slate-700 dark:text-slate-200" placeholder="Document Title...">
        </div>

        <!-- Right Header Tools -->
        <div class="flex items-center space-x-2">
            <!-- Save Status Badge -->
            <div id="saveStatus" class="hidden sm:flex items-center space-x-1.5 text-xs text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800/50 px-2.5 py-1 rounded-full">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="font-medium">Saved</span>
            </div>

            <!-- Encryption Status Indicator -->
            <button id="openEncryptModalBtn" class="flex items-center space-x-1.5 text-xs font-medium px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors">
                <i id="lockIcon" class="fa-solid fa-lock-open text-amber-500"></i>
                <span id="lockStatusText" class="hidden md:inline">Unencrypted</span>
            </button>

            <!-- Theme Toggle -->
            <button id="themeToggleBtn" class="p-2 text-slate-500 hover:text-amber-500 dark:hover:text-amber-400 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="Toggle Light/Dark Theme">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block"></i>
            </button>

            <!-- Export Menu Button -->
            <div class="relative group">
                <button id="exportDropdownBtn" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-xs font-semibold flex items-center space-x-1.5 shadow-md shadow-brand-600/20 transition-all">
                    <i class="fa-solid fa-download"></i>
                    <span>Export</span>
                    <i class="fa-solid fa-chevron-down text-[10px] opacity-80"></i>
                </button>
                <div class="absolute right-0 mt-1 w-40 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-xl hidden group-hover:block p-1.5 z-50">
                    <button id="exportMdBtn" class="w-full text-left px-3 py-1.5 text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg flex items-center space-x-2 text-slate-700 dark:text-slate-200">
                        <i class="fa-brands fa-markdown text-brand-500"></i>
                        <span>Markdown (.md)</span>
                    </button>
                    <button id="exportJsonBtn" class="w-full text-left px-3 py-1.5 text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg flex items-center space-x-2 text-slate-700 dark:text-slate-200">
                        <i class="fa-solid fa-code text-tealAccent-500"></i>
                        <span>Backup (.json)</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between transition-all duration-300 transform -translate-x-full lg:translate-x-0 absolute lg:relative z-10 h-[calc(100vh-4rem)]">
            <div class="p-4 space-y-6 overflow-y-auto">
                <!-- Actions -->
                <button id="newDocBtn" class="w-full py-2.5 px-4 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-700 hover:to-indigo-700 text-white rounded-xl font-semibold text-sm shadow-md shadow-brand-500/20 flex items-center justify-center space-x-2 transition-all">
                    <i class="fa-solid fa-plus"></i>
                    <span>New Document</span>
                </button>

                <!-- Navigation List -->
                <nav class="space-y-1">
                    <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 px-3 mb-2">Workspace</div>
                    <a href="#" class="flex items-center space-x-3 px-3 py-2 text-xs font-medium text-brand-600 dark:text-brand-400 bg-brand-50 dark:bg-brand-950/60 rounded-xl border border-brand-100 dark:border-brand-900/50">
                        <i class="fa-solid fa-pen-nib text-sm"></i>
                        <span>Editor</span>
                    </a>
                </nav>

                <!-- Quick Templates -->
                <div class="space-y-2">
                    <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 px-3">Templates</div>
                    <div class="space-y-1">
                        <button class="template-btn w-full text-left px-3 py-2 text-xs text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors flex items-center space-x-2.5" data-template="blog">
                            <i class="fa-solid fa-newspaper text-indigo-500"></i>
                            <span>Blog Post Outline</span>
                        </button>
                        <button class="template-btn w-full text-left px-3 py-2 text-xs text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors flex items-center space-x-2.5" data-template="notes">
                            <i class="fa-solid fa-list-check text-tealAccent-500"></i>
                            <span>Meeting Notes</span>
                        </button>
                    </div>
                </div>

                <!-- Document List Section -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between px-3">
                        <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Saved Docs</span>
                        <span id="docCountBadge" class="text-[10px] bg-slate-100 dark:bg-slate-800 text-slate-500 px-1.5 py-0.5 rounded-md font-mono">0</span>
                    </div>
                    <div id="savedDocsList" class="space-y-1 max-h-48 overflow-y-auto pr-1">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>

            <!-- Footer Stats Indicator -->
            <div class="p-4 border-t border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50">
                <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
                    <span class="flex items-center space-x-1.5">
                        <i class="fa-solid fa-hard-drive text-brand-500"></i>
                        <span>Storage Used</span>
                    </span>
                    <span id="storageUsedText" class="font-mono text-[11px]">0 KB</span>
                </div>
            </div>
        </aside>

        <!-- Main Writing Area -->
        <main class="flex-1 flex flex-col h-full bg-slate-50 dark:bg-slate-950 overflow-hidden">
            <!-- Formatting Toolbar -->
            <div class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-2 flex flex-wrap items-center gap-1 shadow-sm z-10">
                <!-- Text Styles -->
                <div class="flex items-center space-x-0.5 bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl">
                    <button class="format-btn p-1.5 hover:bg-white dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs w-7 h-7 flex items-center justify-center transition-all" data-cmd="bold" title="Bold (Ctrl+B)" onmousedown="event.preventDefault()">
                        <i class="fa-solid fa-bold"></i>
                    </button>
                    <button class="format-btn p-1.5 hover:bg-white dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs w-7 h-7 flex items-center justify-center transition-all" data-cmd="italic" title="Italic (Ctrl+I)" onmousedown="event.preventDefault()">
                        <i class="fa-solid fa-italic"></i>
                    </button>
                    <button class="format-btn p-1.5 hover:bg-white dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs w-7 h-7 flex items-center justify-center transition-all" data-cmd="underline" title="Underline (Ctrl+U)" onmousedown="event.preventDefault()">
                        <i class="fa-solid fa-underline"></i>
                    </button>
                    <button class="format-btn p-1.5 hover:bg-white dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs w-7 h-7 flex items-center justify-center transition-all" data-cmd="strikeThrough" title="Strikethrough" onmousedown="event.preventDefault()">
                        <i class="fa-solid fa-strikethrough"></i>
                    </button>
                </div>

                <div class="h-5 w-px bg-slate-200 dark:bg-slate-800 mx-1"></div>

                <!-- Headings -->
                <div class="flex items-center space-x-0.5 bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl">
                    <button class="format-btn px-2 py-1 hover:bg-white dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs font-bold transition-all" data-cmd="formatBlock" data-val="<h1>" title="Heading 1" onmousedown="event.preventDefault()">H1</button>
                    <button class="format-btn px-2 py-1 hover:bg-white dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs font-bold transition-all" data-cmd="formatBlock" data-val="<h2>" title="Heading 2" onmousedown="event.preventDefault()">H2</button>
                    <button class="format-btn px-2 py-1 hover:bg-white dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs font-bold transition-all" data-cmd="formatBlock" data-val="<p>" title="Paragraph" onmousedown="event.preventDefault()">P</button>
                </div>

                <div class="h-5 w-px bg-slate-200 dark:bg-slate-800 mx-1"></div>

                <!-- Lists & Quote -->
                <div class="flex items-center space-x-0.5 bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl">
                    <button class="format-btn p-1.5 hover:bg-white dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs w-7 h-7 flex items-center justify-center transition-all" data-cmd="insertUnorderedList" title="Bullet List" onmousedown="event.preventDefault()">
                        <i class="fa-solid fa-list-ul"></i>
                    </button>
                    <button class="format-btn p-1.5 hover:bg-white dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs w-7 h-7 flex items-center justify-center transition-all" data-cmd="insertOrderedList" title="Numbered List" onmousedown="event.preventDefault()">
                        <i class="fa-solid fa-list-ol"></i>
                    </button>
                    <button class="format-btn p-1.5 hover:bg-white dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs w-7 h-7 flex items-center justify-center transition-all" data-cmd="formatBlock" data-val="<blockquote>" title="Blockquote" onmousedown="event.preventDefault()">
                        <i class="fa-solid fa-quote-left"></i>
                    </button>
                </div>

                <div class="h-5 w-px bg-slate-200 dark:bg-slate-800 mx-1"></div>

                <!-- Image & Link Insertion Actions -->
                <div class="flex items-center space-x-1 bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl">
                    <button id="openImgUrlModalBtn" class="p-1.5 hover:bg-white dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs flex items-center space-x-1 px-2.5 transition-all" title="Insert Image via Web URL">
                        <i class="fa-solid fa-link text-brand-500"></i>
                        <span class="font-medium text-[11px]">Image URL</span>
                    </button>
                    <label class="p-1.5 hover:bg-white dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs flex items-center space-x-1 px-2.5 cursor-pointer transition-all" title="Upload Local Image File">
                        <i class="fa-solid fa-upload text-tealAccent-500"></i>
                        <span class="font-medium text-[11px]">Upload</span>
                        <input type="file" id="localImgUpload" accept="image/*" class="hidden">
                    </label>
                </div>

                <div class="h-5 w-px bg-slate-200 dark:bg-slate-800 mx-1"></div>

                <!-- Clear Formatting -->
                <button class="format-btn p-1.5 hover:bg-rose-50 dark:hover:bg-rose-950/50 hover:text-rose-600 rounded-lg text-slate-500 text-xs w-7 h-7 flex items-center justify-center transition-all ml-auto" data-cmd="removeFormat" title="Clear Formatting" onmousedown="event.preventDefault()">
                    <i class="fa-solid fa-eraser"></i>
                </button>
            </div>

            <!-- Editor Canvas Wrapper -->
            <div id="editorWrapper" class="flex-1 overflow-y-auto p-4 sm:p-8 flex justify-center relative">
                <div class="w-full max-w-3xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/80 rounded-2xl shadow-sm p-6 sm:p-12 min-h-[calc(100vh-14rem)] flex flex-col relative transition-all">
                    
                    <!-- Contenteditable Surface -->
                    <div id="editor" contenteditable="true" placeholder="Start writing your masterwork here... Drag & drop or paste images directly!" class="w-full flex-1 focus:outline-none prose dark:prose-invert prose-brand max-w-none text-slate-800 dark:text-slate-100 leading-relaxed text-base"></div>

                </div>

                <!-- Drag & Drop Overlay Indicator -->
                <div id="dropZoneOverlay" class="absolute inset-4 bg-brand-500/10 dark:bg-brand-500/20 backdrop-blur-sm border-2 border-dashed border-brand-500 rounded-2xl flex flex-col items-center justify-center pointer-events-none opacity-0 transition-opacity duration-200 z-40">
                    <div class="w-16 h-16 rounded-full bg-brand-500 text-white flex items-center justify-center shadow-lg mb-3 animate-bounce">
                        <i class="fa-solid fa-cloud-arrow-up text-2xl"></i>
                    </div>
                    <p class="font-semibold text-brand-600 dark:text-brand-300">Drop Image Here to Insert</p>
                </div>
            </div>

            <!-- Metadata Footer Bar -->
            <div class="h-9 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-6 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 select-none">
                <div class="flex items-center space-x-4">
                    <span>Words: <strong id="wordCount" class="text-slate-700 dark:text-slate-200 font-semibold">0</strong></span>
                    <span>Chars: <strong id="charCount" class="text-slate-700 dark:text-slate-200 font-semibold">0</strong></span>
                </div>
                <div class="flex items-center space-x-4">
                    <span>Est. Read Time: <strong id="readTime" class="text-slate-700 dark:text-slate-200 font-semibold">0 min</strong></span>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal: Insert Image URL -->
    <div id="imgUrlModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl w-full max-w-md p-6 space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-slate-800 dark:text-slate-100 flex items-center space-x-2">
                    <i class="fa-solid fa-image text-brand-500"></i>
                    <span>Insert Image via Web URL</span>
                </h3>
                <button id="closeImgModalBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <input type="url" id="imgUrlInput" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:border-brand-500 dark:text-slate-100" placeholder="https://example.com/image.png">
            <div class="flex justify-end space-x-2">
                <button id="cancelImgModalBtn" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300">Cancel</button>
                <button id="confirmImgUrlBtn" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-semibold shadow-md shadow-brand-500/20">Insert Image</button>
            </div>
        </div>
    </div>

    <!-- Modal: AES Encryption Settings -->
    <div id="encryptModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl w-full max-w-md p-6 space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-slate-800 dark:text-slate-100 flex items-center space-x-2">
                    <i class="fa-solid fa-shield-halved text-brand-500"></i>
                    <span>Document Encryption (AES-256)</span>
                </h3>
                <button id="closeEncryptModalBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400">Protect this document locally with a password before exporting or saving.</p>
            <input type="password" id="encryptPassInput" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:border-brand-500 dark:text-slate-100" placeholder="Set Encryption Password...">
            <div class="flex justify-between items-center pt-2">
                <button id="removeEncryptBtn" class="text-xs text-rose-500 hover:underline font-medium hidden">Remove Password</button>
                <div class="flex space-x-2 ml-auto">
                    <button id="cancelEncryptModalBtn" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300">Cancel</button>
                    <button id="saveEncryptBtn" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-semibold shadow-md shadow-brand-500/20">Apply Lock</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Core Application State ---
        let currentDocId = 'doc_' + Date.now();
        let encryptionPassword = '';
        let isDarkMode = false;

        // Templates Definition
        const TEMPLATES = {
            blog: `<h1>Crafting an Engaging Blog Post</h1><p>Introduce your main topic here. Hook the reader with a compelling story or interesting stat!</p><h2>1. Key Insights</h2><p>Detail your first primary point with clear bullet lists and imagery.</p><p></p><h2>2. Summary & Conclusion</h2><p>Wrap up your core takeaways and invite comments.</p>`,
            notes: `<h1>Meeting Notes & Action Items</h1><p><strong>Date:</strong> ${new Date().toLocaleDateString()}</p><h3>Attendees:</h3><ul><li>Team Member 1</li><li>Team Member 2</li></ul><h3>Key Takeaways:</h3><ol><li>Discussed v0.2 release milestones.</li><li>Reviewed new interactive image deletion tool.</li></ol>`
        };

        // DOM Element Cache
        const editor = document.getElementById('editor');
        const documentTitleInput = document.getElementById('documentTitleInput');
        const wordCountEl = document.getElementById('wordCount');
        const charCountEl = document.getElementById('charCount');
        const readTimeEl = document.getElementById('readTime');
        const storageUsedText = document.getElementById('storageUsedText');
        const savedDocsList = document.getElementById('savedDocsList');
        const docCountBadge = document.getElementById('docCountBadge');
        const saveStatus = document.getElementById('saveStatus');

        /**
         * Encapsulates raw <img> elements inside custom interactive wrapper
         * containing floating control toolbars for alignment and removal.
         */
        function wrapImageWithControls(imgElement) {
            if (imgElement.parentElement && imgElement.parentElement.classList.contains('editor-image-wrapper')) {
                return; // Already wrapped
            }

            const wrapper = document.createElement('div');
            wrapper.className = 'editor-image-wrapper align-center';
            wrapper.contentEditable = 'false';

            // Toolbar Overlay
            const toolbar = document.createElement('div');
            toolbar.className = 'image-toolbar';

            // Align Left Button
            const alignLeftBtn = document.createElement('button');
            alignLeftBtn.className = 'text-xs text-slate-300 hover:text-white p-1 rounded hover:bg-slate-700/60';
            alignLeftBtn.innerHTML = '<i class="fa-solid fa-align-left"></i>';
            alignLeftBtn.title = 'Align Left';
            alignLeftBtn.onclick = (e) => {
                e.preventDefault();
                wrapper.className = 'editor-image-wrapper align-left';
                triggerAutoSave();
            };

            // Align Center Button
            const alignCenterBtn = document.createElement('button');
            alignCenterBtn.className = 'text-xs text-slate-300 hover:text-white p-1 rounded hover:bg-slate-700/60';
            alignCenterBtn.innerHTML = '<i class="fa-solid fa-align-center"></i>';
            alignCenterBtn.title = 'Align Center';
            alignCenterBtn.onclick = (e) => {
                e.preventDefault();
                wrapper.className = 'editor-image-wrapper align-center';
                triggerAutoSave();
            };

            // Align Right Button
            const alignRightBtn = document.createElement('button');
            alignRightBtn.className = 'text-xs text-slate-300 hover:text-white p-1 rounded hover:bg-slate-700/60';
            alignRightBtn.innerHTML = '<i class="fa-solid fa-align-right"></i>';
            alignRightBtn.title = 'Align Right';
            alignRightBtn.onclick = (e) => {
                e.preventDefault();
                wrapper.className = 'editor-image-wrapper align-right';
                triggerAutoSave();
            };

            // REMOVE/DELETE Button
            const removeBtn = document.createElement('button');
            removeBtn.className = 'text-xs text-rose-400 hover:text-rose-300 p-1 rounded hover:bg-rose-900/40 ml-1 border-l border-slate-700/80 pl-1.5';
            removeBtn.innerHTML = '<i class="fa-solid fa-trash-can mr-1"></i>Remove';
            removeBtn.title = 'Delete Image';
            removeBtn.onclick = (e) => {
                e.preventDefault();
                wrapper.remove();
                updateStats();
                triggerAutoSave();
            };

            toolbar.appendChild(alignLeftBtn);
            toolbar.appendChild(alignCenterBtn);
            toolbar.appendChild(alignRightBtn);
            toolbar.appendChild(removeBtn);

            // Replace image with wrapper in DOM
            imgElement.parentNode.insertBefore(wrapper, imgElement);
            wrapper.appendChild(toolbar);
            wrapper.appendChild(imgElement);
        }

        // Scan and sanitize unwrapped images inside editor
        function sanitizeEditorImages() {
            const imgs = editor.querySelectorAll('img');
            imgs.forEach(img => wrapImageWithControls(img));
        }

        function insertImageSrc(src) {
            const img = document.createElement('img');
            img.src = src;
            img.alt = 'Inserted Content';
            
            // Insert at selection cursor or append
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
                const range = sel.getRangeAt(0);
                if (editor.contains(range.commonAncestorContainer)) {
                    range.insertNode(img);
                } else {
                    editor.appendChild(img);
                }
            } else {
                editor.appendChild(img);
            }

            // Immediately attach interactive removal controls
            wrapImageWithControls(img);
            updateStats();
            triggerAutoSave();
        }

        // Local File Reader Handler
        function handleFileSelection(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (e) => insertImageSrc(e.target.result);
            reader.readAsDataURL(file);
        }

        // Local upload input listener
        document.getElementById('localImgUpload').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelection(e.target.files[0]);
                e.target.value = '';
            }
        });

        // Clipboard Paste Listener
        editor.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.type.indexOf('image') === 0) {
                    e.preventDefault();
                    const blob = item.getAsFile();
                    handleFileSelection(blob);
                }
            }
        });

        // Drag & Drop Handling
        const editorWrapper = document.getElementById('editorWrapper');
        const dropZoneOverlay = document.getElementById('dropZoneOverlay');

        ['dragenter', 'dragover'].forEach(eventName => {
            editorWrapper.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZoneOverlay.classList.remove('opacity-0');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            editorWrapper.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZoneOverlay.classList.add('opacity-0');
            }, false);
        });

        editorWrapper.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files && files.length > 0) {
                handleFileSelection(files[0]);
            }
        });

        document.querySelectorAll('.format-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const cmd = btn.getAttribute('data-cmd');
                const val = btn.getAttribute('data-val') || null;
                document.execCommand(cmd, false, val);
                editor.focus();
                triggerAutoSave();
            });
        });

        // Live stats counter
        function updateStats() {
            const text = editor.innerText || '';
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const chars = text.length;
            const minutes = Math.ceil(words / 200);

            wordCountEl.textContent = words;
            charCountEl.textContent = chars;
            readTimeEl.textContent = `${minutes} min`;

            // Storage estimate calculation
            const rawStorage = JSON.stringify(localStorage).length;
            storageUsedText.textContent = `${(rawStorage / 1024).toFixed(1)} KB`;
        }

        editor.addEventListener('input', () => {
            sanitizeEditorImages();
            updateStats();
            triggerAutoSave();
        });

        documentTitleInput.addEventListener('input', () => {
            triggerAutoSave();
        });

        let autoSaveTimer = null;
        function triggerAutoSave() {
            saveStatus.classList.remove('hidden');
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                saveCurrentDocument();
            }, 800);
        }

        function saveCurrentDocument() {
            let contentHtml = editor.innerHTML;
            
            // Encrypt if password set
            if (encryptionPassword) {
                contentHtml = CryptoJS.AES.encrypt(contentHtml, encryptionPassword).toString();
            }

            const docData = {
                id: currentDocId,
                title: documentTitleInput.value || 'Untitled Document',
                content: contentHtml,
                isEncrypted: !!encryptionPassword,
                updatedAt: Date.now()
            };

            localStorage.setItem(currentDocId, JSON.stringify(docData));
            renderSavedDocsList();
        }

        function renderSavedDocsList() {
            savedDocsList.innerHTML = '';
            const keys = Object.keys(localStorage).filter(k => k.startsWith('doc_'));
            docCountBadge.textContent = keys.length;

            keys.sort((a, b) => b.localeCompare(a)).forEach(key => {
                try {
                    const item = JSON.parse(localStorage.getItem(key));
                    const docItem = document.createElement('div');
                    docItem.className = `group flex items-center justify-between px-3 py-2 text-xs rounded-xl cursor-pointer transition-colors ${key === currentDocId ? 'bg-brand-50 dark:bg-brand-950/60 text-brand-600 dark:text-brand-400 font-semibold' : 'hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300'}`;
                    
                    docItem.innerHTML = `
                        <div class="flex items-center space-x-2 truncate flex-1" onclick="loadDocument('${key}')">
                            <i class="fa-solid ${item.isEncrypted ? 'fa-lock text-amber-500' : 'fa-file-lines text-slate-400'}"></i>
                            <span class="truncate">${item.title}</span>
                        </div>
                        <button onclick="deleteDocument('${key}', event)" class="opacity-0 group-hover:opacity-100 p-1 hover:text-rose-500 text-slate-400 transition-opacity">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    `;
                    savedDocsList.appendChild(docItem);
                } catch(e) {}
            });
            updateStats();
        }

        window.loadDocument = function(key) {
            const raw = localStorage.getItem(key);
            if (!raw) return;
            const docData = JSON.parse(raw);
            currentDocId = docData.id;
            documentTitleInput.value = docData.title;

            if (docData.isEncrypted) {
                const pass = prompt('Enter Encryption Password for this document:');
                if (pass) {
                    try {
                        const bytes = CryptoJS.AES.decrypt(docData.content, pass);
                        const decrypted = bytes.toString(CryptoJS.enc.Utf8);
                        if (decrypted) {
                            editor.innerHTML = decrypted;
                            encryptionPassword = pass;
                            updateLockBadge(true);
                        } else {
                            alert('Incorrect encryption key!');
                            return;
                        }
                    } catch(e) {
                        alert('Failed to decrypt content.');
                        return;
                    }
                } else {
                    return;
                }
            } else {
                editor.innerHTML = docData.content;
                encryptionPassword = '';
                updateLockBadge(false);
            }

            sanitizeEditorImages();
            updateStats();
            renderSavedDocsList();
        };

        window.deleteDocument = function(key, e) {
            e.stopPropagation();
            if (confirm('Are you sure you want to delete this document?')) {
                localStorage.removeItem(key);
                if (key === currentDocId) {
                    createNewDocument();
                } else {
                    renderSavedDocsList();
                }
            }
        };

        function createNewDocument() {
            currentDocId = 'doc_' + Date.now();
            documentTitleInput.value = 'Untitled Story';
            editor.innerHTML = '';
            encryptionPassword = '';
            updateLockBadge(false);
            updateStats();
            renderSavedDocsList();
        }

        document.getElementById('newDocBtn').addEventListener('click', createNewDocument);

        // Theme Switcher
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        themeToggleBtn.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            document.documentElement.classList.toggle('dark', isDarkMode);
        });

        // Image URL Modal
        const imgUrlModal = document.getElementById('imgUrlModal');
        const imgUrlInput = document.getElementById('imgUrlInput');
        document.getElementById('openImgUrlModalBtn').addEventListener('click', () => {
            imgUrlModal.classList.remove('opacity-0', 'pointer-events-none');
            imgUrlInput.focus();
        });
        const closeImgModal = () => imgUrlModal.classList.add('opacity-0', 'pointer-events-none');
        document.getElementById('closeImgModalBtn').addEventListener('click', closeImgModal);
        document.getElementById('cancelImgModalBtn').addEventListener('click', closeImgModal);
        document.getElementById('confirmImgUrlBtn').addEventListener('click', () => {
            if (imgUrlInput.value.trim()) {
                insertImageSrc(imgUrlInput.value.trim());
                imgUrlInput.value = '';
                closeImgModal();
            }
        });

        // Encryption Lock Modal
        const encryptModal = document.getElementById('encryptModal');
        const encryptPassInput = document.getElementById('encryptPassInput');
        const lockIcon = document.getElementById('lockIcon');
        const lockStatusText = document.getElementById('lockStatusText');
        const removeEncryptBtn = document.getElementById('removeEncryptBtn');

        document.getElementById('openEncryptModalBtn').addEventListener('click', () => {
            encryptModal.classList.remove('opacity-0', 'pointer-events-none');
            encryptPassInput.value = encryptionPassword;
            removeEncryptBtn.classList.toggle('hidden', !encryptionPassword);
            encryptPassInput.focus();
        });
        const closeEncryptModal = () => encryptModal.classList.add('opacity-0', 'pointer-events-none');
        document.getElementById('closeEncryptModalBtn').addEventListener('click', closeEncryptModal);
        document.getElementById('cancelEncryptModalBtn').addEventListener('click', closeEncryptModal);
        
        document.getElementById('saveEncryptBtn').addEventListener('click', () => {
            encryptionPassword = encryptPassInput.value.trim();
            updateLockBadge(!!encryptionPassword);
            closeEncryptModal();
            triggerAutoSave();
        });

        removeEncryptBtn.addEventListener('click', () => {
            encryptionPassword = '';
            updateLockBadge(false);
            closeEncryptModal();
            triggerAutoSave();
        });

        function updateLockBadge(isLocked) {
            lockIcon.className = `fa-solid ${isLocked ? 'fa-lock text-amber-500' : 'fa-lock-open text-slate-400'}`;
            lockStatusText.textContent = isLocked ? 'Encrypted' : 'Unencrypted';
        }

        // Templates Selection
        document.querySelectorAll('.template-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const key = btn.getAttribute('data-template');
                if (TEMPLATES[key]) {
                    if (editor.innerText.trim() === '' || confirm('Replace current editor contents with template?')) {
                        editor.innerHTML = TEMPLATES[key];
                        sanitizeEditorImages();
                        updateStats();
                        triggerAutoSave();
                    }
                }
            });
        });

        // Exports Mechanics
        document.getElementById('exportMdBtn').addEventListener('click', () => {
            const blob = new Blob([editor.innerText], { type: 'text/markdown;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${documentTitleInput.value || 'document'}.md`;
            a.click();
        });

        document.getElementById('exportJsonBtn').addEventListener('click', () => {
            const data = {
                title: documentTitleInput.value,
                content: editor.innerHTML,
                exportedAt: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${documentTitleInput.value || 'backup'}.json`;
            a.click();
        });

        // Responsive Sidebar Toggle
        const sidebar = document.getElementById('sidebar');
        document.getElementById('toggleSidebarBtn').addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
        });

        // Initialize App State
        window.onload = () => {
            renderSavedDocsList();
            updateStats();
        };
    </script>
</body>
</html>
